services:
  - type: web
    name: gaelicsounds
    env: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: AUDIO_CACHE_DIR
        value: /app/audio_cache
      - key: AZURE_WELSH_VOICE
        value: cy-GB-NiaNeural
      # Configurar en el panel de Render para Galés (Azure Speech):
      # - key: AZURE_SPEECH_KEY
      #   sync: false
      # - key: AZURE_SPEECH_REGION
      #   value: eastus
